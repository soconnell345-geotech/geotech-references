name: Tests

# The whole suite on GitHub's runners, so a merge or a release is not gated
# on the developer's own machine.
#
# - A push to main runs it.
# - A push to a branch named ci/<anything> runs it on that branch: push a
#   feature branch under that name to gate it here before the merge.
# - A pull request to main runs it; workflow_dispatch runs it by hand.
on:
  push:
    branches: [main, "ci/**"]
    # A commit that touches only prose does not start the suite.
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the newest commit of a branch needs testing: a newer push cancels
# the run still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: ubuntu-latest moves between releases.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      # One Python version failing must not cancel the other's run.
      fail-fast: false
      # The two jobs differ on purpose, in the PDF reader (PyMuPDF).
      #
      # The chapter text of a script-built reference (scripts/
      # build_printed_text.py; each such manifest has "text_build") is read
      # off its PDF, and two PyMuPDF versions do not return the same thing
      # on every page. So the reader's version is an input of the build:
      # each script-built manifest records it ("built_with": {"pymupdf":
      # ...}), and the test that rebuilds the text and compares it with the
      # committed files runs only under that version (tests/_build_reader.py).
      #
      # - 3.10, the floor the package declares: the recorded reader, and
      #   GEOTECH_REQUIRE_BUILD_READER=1, so the rebuild tests run and must
      #   pass; a different reader there is a failure, never a skip.
      # - 3.12, what the hosts the library runs on have: the newest reader;
      #   the rebuild tests skip with their reason, and every other test,
      #   those that read the PDFs included, is proven under it.
      #
      # To move the build reader on purpose: install the new version,
      # rebuild every script-built reference (python
      # scripts/build_printed_text.py <package>), read each difference in
      # the chapter files against the rendered page, and in one commit
      # record the new version in every script-built manifest and in the
      # pin below (tests/test_build_reader.py checks they agree).
      matrix:
        include:
          - python-version: "3.10"
            pymupdf: "pymupdf==1.27.2.3"
            require-build-reader: "1"
          - python-version: "3.12"
            pymupdf: "pymupdf"
            require-build-reader: ""

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package, the plot extra, the PDF reader and pytest
        # PyMuPDF is not a dependency of the package: the tests that read
        # the printed manuals in docs/ need it and skip without it; which
        # version each job installs is set in the matrix above. The
        # annotate plugin puts each failing test's message on the run, where
        # it can be read without signing in.
        run: |
          pip install --upgrade pip
          pip install -e ".[plot]"
          pip install pytest "${{ matrix.pymupdf }}" pytest-github-actions-annotate-failures

      - name: What is installed
        run: |
          python -c "import geotech_references, importlib.metadata as m; print('geotech-references', m.version('geotech-references'))"
          pip list 2>/dev/null | grep -i -E "^(numpy|matplotlib|pymupdf|pytest) "
          lscpu | grep -E "Model name|^CPU\(s\)"

      - name: Run tests
        # One process, as the suite is run before a merge: the shared search
        # databases are built once at the start of the run.
        env:
          GEOTECH_REQUIRE_BUILD_READER: ${{ matrix.require-build-reader }}
        run: python -m pytest -q --tb=short --durations=15 -p no:cacheprovider -rs
