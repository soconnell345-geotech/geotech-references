[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geotech-references"
version = "1.2.2"
description = "Digitized geotechnical reference library — NAVFAC DM7, UFC 3-220-04N/05/07, UFC 3-260-02, FHWA GEC-6/7/10/11/12/13, Micropile, FEMA P-2192, and NOAA frost depth references"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Sean O'Connell", email = "soconnell345@gmail.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/soconnell345-geotech/geotech-references"
Repository = "https://github.com/soconnell345-geotech/geotech-references"

[tool.setuptools.packages.find]
include = ["geotech_references*"]
exclude = ["agents*"]

[tool.setuptools.package-data]
geotech_references = ["*/text/*.json", "*/figures_catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
