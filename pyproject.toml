[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geotech-references"
version = "1.4.1"
description = "Digitized geotechnical reference library: 33 packages of callable functions and structured text, including DM 7.1/7.2, FHWA GEC-4 to GEC-14, the FHWA Soils and Foundations and Pavements manuals, micropiles, the UFC pavement and structural criteria, AASHTO 1993, Eurocode 7, EM 1110-2-2104/2107, FEMA P-2082, wood handbook and the Caltrans Trenching and Shoring Manual"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Sean O'Connell", email = "soconnell345@gmail.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/soconnell345-geotech/geotech-references"
Repository = "https://github.com/soconnell345-geotech/geotech-references"

[tool.setuptools.packages.find]
include = ["geotech_references*"]
exclude = ["agents*"]

[tool.setuptools.package-data]
geotech_references = ["*/text/*.json", "*/figures_catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
